# Build and upload the iOS app to TestFlight on Codemagic's hosted Macs (no Mac of our own).
#
# One-time setup in Codemagic (https://codemagic.io, free personal account, signed in with
# the GitHub account that can read this repo). Everything is an environment variable on the
# app (App → Environment variables), so no paid team or Integrations page is needed:
#   group "signing" (all three marked secret):
#     APP_STORE_CONNECT_ISSUER_ID      Issuer ID shown at App Store Connect → Users and Access
#                                      → Integrations → App Store Connect API
#     APP_STORE_CONNECT_KEY_IDENTIFIER Key ID of a Team Key made there with Admin access
#     APP_STORE_CONNECT_PRIVATE_KEY    the whole contents of the downloaded AuthKey_<KeyID>.p8
#     CERTIFICATE_PRIVATE_KEY          an RSA private key (PEM) that becomes the private key of
#                                      the Apple Distribution certificate
#                                      (`ssh-keygen -t rsa -b 2048 -m PEM -f ios_distribution_private_key -q -N ""`);
#                                      keep a copy: a lost key means a new certificate
#   group "firebase" (optional until Firebase has the iOS app; without it push does not work):
#     GOOGLE_SERVICE_INFO_PLIST        base64 of GoogleService-Info.plist from the Firebase
#                                      console (iOS app com.vidhisangh.app)
# Then start the "ios-testflight" workflow on branch play-store-launch. On the first run
# `app-store-connect fetch-signing-files --create` creates the distribution certificate and
# the App Store provisioning profile through the API key (the App ID com.vidhisangh.app must
# exist with Push Notifications and Associated Domains ticked). The `ios_signing` block is
# not used: it only fetches files already uploaded to Codemagic ("No matching profiles
# found", 20 Nov 2026).
# Bump CURRENT_PROJECT_VERSION in frontend/ios/App/App.xcodeproj/project.pbxproj before
# every upload: the live-update publisher reads the build number from the repo.
workflows:
  ios-testflight:
    name: VidhiSangh iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - signing
        - firebase
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.vidhisangh.app
    scripts:
      - name: Firebase config (push notifications)
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > frontend/ios/App/App/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST is not set: building without push"
          fi
      - name: Build the app screens
        script: cd frontend && npm ci && npm run build:mobile
      - name: Signing files (created on first run through the App Store Connect key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Archive
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
