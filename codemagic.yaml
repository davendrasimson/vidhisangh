# Build and upload the iOS app to TestFlight on Codemagic's hosted Macs (no Mac of our own).
#
# One-time setup in Codemagic (https://codemagic.io, sign in with the GitLab/GitHub account
# that can read this repo):
#   1. Teams → Integrations → App Store Connect: upload an API key made at
#      App Store Connect → Users and Access → Integrations → App Store Connect API
#      (role App Manager; note the Issuer ID and Key ID). Name the integration "VidhiSangh Legal Network".
#   2. App → Environment variables → group "firebase": GOOGLE_SERVICE_INFO_PLIST = the
#      base64 of GoogleService-Info.plist from the Firebase console (iOS app
#      com.vidhisangh.app), marked secret.
#   3. App → Environment variables → group "signing": CERTIFICATE_PRIVATE_KEY = an RSA
#      private key (PEM) that becomes the private key of the Apple Distribution certificate
#      (`ssh-keygen -t rsa -b 2048 -m PEM -f ios_distribution_private_key -q -N ""`), marked
#      secret. Keep a copy in the password manager: a lost key means a new certificate.
#   4. Start the "ios-testflight" workflow. `app-store-connect fetch-signing-files --create`
#      creates the distribution certificate and the App Store provisioning profile through
#      the API key (the App ID com.vidhisangh.app must exist with Push Notifications and
#      Associated Domains ticked). The `ios_signing` block is NOT used: it only fetches
#      files already uploaded to Codemagic, which is why the first build failed with
#      "No matching profiles found" (20 Nov 2026).
# Bump CURRENT_PROJECT_VERSION in frontend/ios/App/App.xcodeproj/project.pbxproj before
# every upload: the live-update publisher reads the build number from the repo.
workflows:
  ios-testflight:
    name: VidhiSangh iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: VidhiSangh Legal Network
    environment:
      groups:
        - signing
        - firebase
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.vidhisangh.app
    scripts:
      - name: Firebase config (push notifications)
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > frontend/ios/App/App/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST is not set: building without push"
          fi
      - name: Build the app screens
        script: cd frontend && npm ci && npm run build:mobile
      - name: Signing files (created on first run through the App Store Connect key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Archive
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
