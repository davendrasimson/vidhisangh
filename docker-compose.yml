# ════════════════════════════════════════════════════════════════════
#  VidhiSangh — Local development stack
#  Usage:  cp .env.example .env   # fill in the credentials
#          docker compose up --build
#
#  Hardening (audit A-28):
#    - every published port is bound to 127.0.0.1 — nothing is reachable
#      from the LAN / a coffee-shop network
#    - no credential defaults: `${VAR:?...}` makes compose refuse to start
#      until .env provides them (a copy-pasted default password was the
#      finding; now there is nothing to copy)
#    - Redis requires a password; OpenSearch runs with its security plugin
#      ON (TLS + admin password) and is loopback-only in any case
#    - images pinned by digest where the registry gave us one, MinIO by a
#      dated release tag (no `latest`)
#    - healthchecks on every service; dependants wait for `service_healthy`
# ════════════════════════════════════════════════════════════════════
name: vidhisangh

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: dev
  env_file: .env
  environment:
    VS_POSTGRES_HOST: db
    VS_POSTGRES_USER: ${VS_POSTGRES_USER:?set in .env}
    VS_POSTGRES_PASSWORD: ${VS_POSTGRES_PASSWORD:?set in .env}
    VS_POSTGRES_DB: ${VS_POSTGRES_DB:?set in .env}
    VS_REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
    VS_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/1
    VS_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/2
    VS_STORAGE_BACKEND: s3
    VS_S3_ENDPOINT_URL: http://minio:9000
    VS_S3_ACCESS_KEY: ${VS_S3_ACCESS_KEY:?set in .env}
    VS_S3_SECRET_KEY: ${VS_S3_SECRET_KEY:?set in .env}
    VS_S3_USE_SSL: "false"
    VS_OPENSEARCH_URL: https://admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set in .env}@opensearch:9200
    VS_TRUSTED_PROXY_IPS: 127.0.0.1,::1
  volumes:
    - ./backend:/app
  security_opt:
    - no-new-privileges:true

services:
  # ─── PostgreSQL 17 (with pgvector) ────────────────────────────────
  db:
    # pgvector/pgvector:pg17 — multi-arch index digest, 2026-09-27
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: ${VS_POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${VS_POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${VS_POSTGRES_DB:?set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (cache / rate-limit / celery broker) ───────────────────
  redis:
    # redis:7-alpine — multi-arch index digest, 2026-09-27
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --protected-mode
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}

  # ─── MinIO (S3-compatible object storage) ─────────────────────────
  minio:
    # Dated release tag, never `latest`. Bump deliberately after reading the
    # release notes (verify the tag exists: docker manifest inspect ...).
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VS_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${VS_S3_SECRET_KEY:?set in .env}
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot: create the documents bucket so the backend's startup gate passes.
  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/$${BUCKET} &&
      mc anonymous set none local/$${BUCKET}"
    environment:
      MINIO_ROOT_USER: ${VS_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${VS_S3_SECRET_KEY:?set in .env}
      BUCKET: ${VS_S3_BUCKET:-vidhisangh-documents}
    depends_on:
      minio:
        condition: service_healthy

  # ─── OpenSearch (full-text & semantic search) ─────────────────────
  opensearch:
    # opensearchproject/opensearch:2.17.1 — multi-arch index digest, 2026-09-27
    image: opensearchproject/opensearch:3.10.0@sha256:02d6d6e40c820ae08233b60540aa5d3d9364d64e2dc724e38d6c8c794879b2a0
    environment:
      - discovery.type=single-node
      # Security plugin stays ON: TLS on 9200 + basic auth with the admin
      # password below (must satisfy the plugin's complexity rule).
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set in .env}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:\"$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" https://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Backend API (FastAPI) ────────────────────────────────────────
  backend:
    <<: *backend-common
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips 127.0.0.1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Celery worker (background jobs) ──────────────────────────────
  worker:
    <<: *backend-common
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Frontend (Angular dev server) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "start", "--", "--host", "0.0.0.0"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4200/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  db_data:
  redis_data:
  minio_data:
  opensearch_data:
