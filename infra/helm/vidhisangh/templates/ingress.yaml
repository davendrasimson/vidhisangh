{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vidhisangh.fullname" . }}
  labels:
    {{- include "vidhisangh.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.web | quote }}
      secretName: {{ .Values.ingress.tls.webSecretName }}
    - hosts:
        - {{ .Values.ingress.hosts.api | quote }}
      secretName: {{ .Values.ingress.tls.apiSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.web | quote }}
      http:
        paths:
          {{- if .Values.backend.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "vidhisangh.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.containerPort }}
          {{- end }}
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vidhisangh.frontend.fullname" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
          {{- end }}
    {{- if .Values.backend.enabled }}
    - host: {{ .Values.ingress.hosts.api | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vidhisangh.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.containerPort }}
    {{- end }}
{{- end }}
