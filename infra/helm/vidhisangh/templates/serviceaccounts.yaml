{{- if .Values.serviceAccounts.create }}
{{- range $comp := list "backend" "worker" "frontend" }}
{{- if (index $.Values $comp).enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include (printf "vidhisangh.%s.fullname" $comp) $ }}
  labels:
    {{- include "vidhisangh.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
  {{- with $.Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
