apiVersion: v2
name: vidhisangh
description: VidhiSangh — integrated legal ecosystem platform (backend, frontend, worker).
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - legal
  - fastapi
  - angular
home: https://vidhisangh.com
sources:
  - https://github.com/vidhisangh
maintainers:
  - name: VidhiSangh Platform Team
# Optional infra subcharts — toggled via values (postgresql.enabled / redis.enabled).
# Run `helm dependency update` before installing with these enabled.
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "20.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
