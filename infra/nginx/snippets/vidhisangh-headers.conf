# ════════════════════════════════════════════════════════════════════
#  VidhiSangh — response security headers (I-2 / I-3)
#
#  nginx `add_header` directives are NOT inherited into a location block
#  that declares its own add_header (the SPA's Cache-Control did exactly
#  that and dropped HSTS/nosniff from every HTML and JS response). This
#  snippet is therefore `include`d in EVERY location that sets a header,
#  and in the server block, so the full set is always emitted.
#
#  Install: /etc/nginx/snippets/vidhisangh-headers.conf
# ════════════════════════════════════════════════════════════════════

# Two years, subdomains, preload — submit to hstspreload.org once verified.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff"                         always;
add_header X-Frame-Options           "DENY"                            always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\"), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content Security Policy for the Angular SPA.
#   script-src   : own bundles + Razorpay Checkout loader. No 'unsafe-inline'
#                  (Angular's build emits no inline scripts).
#   style-src    : 'unsafe-inline' is required by Angular Material / CDK,
#                  which set element styles at runtime.
#   img-src      : own, data: (inline SVG/avatars), https: (link previews,
#                  news thumbnails, judgment sources).
#   font-src     : self-hosted Inter / Source Serif 4 / Tiro Devanagari /
#                  Material Icons (A-33 — no Google Fonts) + data: for
#                  Material's inline icon fonts.
#   connect-src  : own API + Razorpay APIs + own WebSocket.
#   frame-src    : Razorpay Checkout iframe only.
#   frame-ancestors 'none' : never framed (clickjacking); mirrors XFO DENY.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com wss://vidhisangh.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
