# ════════════════════════════════════════════════════════════════════
#  VidhiSangh — API proxy parameters
#  Install: /etc/nginx/snippets/vidhisangh-proxy.conf
#
#  X-Forwarded-For is SET to $remote_addr, not appended with
#  $proxy_add_x_forwarded_for: the app trusts the first element for rate
#  limiting and lockout, so an appended header let a client choose its own
#  identity (A-2, confirmed on production). With this the app only ever
#  sees the TCP peer address nginx saw.
# ════════════════════════════════════════════════════════════════════
proxy_pass         http://vidhisangh_api;
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $remote_addr;
proxy_set_header   X-Forwarded-Proto https;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   Connection        "";
proxy_read_timeout    120s;
proxy_send_timeout    120s;
proxy_connect_timeout 5s;
proxy_request_buffering on;    # nginx enforces client_max_body_size before the app sees bytes
proxy_hide_header  X-Powered-By;
