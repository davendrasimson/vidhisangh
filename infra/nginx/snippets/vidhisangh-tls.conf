# ════════════════════════════════════════════════════════════════════
#  VidhiSangh — TLS parameters (I-10)
#  Mozilla SSL Configuration Generator, "intermediate" profile (2026):
#  TLS 1.2 + 1.3, AEAD-only cipher list, client preference, OCSP stapling.
#  Install: /etc/nginx/snippets/vidhisangh-tls.conf
# ════════════════════════════════════════════════════════════════════
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve            X25519:prime256v1:secp384r1;

ssl_session_timeout       1d;
ssl_session_cache         shared:VidhiSanghSSL:10m;   # ~40,000 sessions
ssl_session_tickets       off;

# OCSP stapling — the chain file is the certbot fullchain for this cert.
ssl_stapling              on;
ssl_stapling_verify       on;
ssl_trusted_certificate   /etc/letsencrypt/live/vidhisangh.com/chain.pem;
resolver                  127.0.0.53 valid=300s;      # systemd-resolved on the host
resolver_timeout          5s;
