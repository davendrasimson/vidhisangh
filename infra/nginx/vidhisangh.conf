# ════════════════════════════════════════════════════════════════════
#  VidhiSangh — Edge / reverse-proxy (production)
#  Terminates TLS at the platform edge and fans out to the frontend and
#  backend services. Drop into /etc/nginx/conf.d/ (http{} context).
#
#  Assumptions:
#    - `frontend` serves the built SPA on :8080 (see frontend/nginx.conf)
#    - `backend`  serves the FastAPI app on :8000
#  Replace TLS cert paths + server_name with real values before use.
# ════════════════════════════════════════════════════════════════════

# ─── Upstreams ──────────────────────────────────────────────────────
upstream vidhisangh_frontend {
    server frontend:8080;
    keepalive 32;
}

upstream vidhisangh_backend {
    server backend:8000;
    keepalive 64;
}

# WebSocket / SSE upgrade helper.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── HTTP :80 — redirect everything to HTTPS ────────────────────────
# (ACME http-01 challenge is served directly; everything else 301s.)
server {
    listen      80;
    listen      [::]:80;
    server_name vidhisangh.com www.vidhisangh.com api.vidhisangh.com;

    # Let's Encrypt / cert-manager HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS :443 — main edge server ──────────────────────────────────
server {
    # NOTE: Enable the TLS block below once certificates are provisioned.
    # Until then this listens on :80 so the reverse proxy is functional.
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name vidhisangh.com www.vidhisangh.com;

    # ─── TLS 1.3 (uncomment when certs exist) ───────────────────────
    # listen              443 ssl;
    # listen              [::]:443 ssl;
    # http2               on;
    # ssl_certificate     /etc/nginx/certs/vidhisangh.com/fullchain.pem;   # placeholder
    # ssl_certificate_key /etc/nginx/certs/vidhisangh.com/privkey.pem;     # placeholder
    # ssl_protocols       TLSv1.3 TLSv1.2;                                  # prefer 1.3, allow 1.2
    # ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;
    # ssl_stapling        on;
    # ssl_stapling_verify on;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    server_tokens off;

    # ─── Baseline security headers ──────────────────────────────────
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-Frame-Options        "DENY"                             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;

    # ─── Compression ────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml application/wasm;

    client_max_body_size 50m;   # allow document uploads

    # ─── API → backend ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://vidhisangh_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Realtime (WebSocket / SSE) under /api/v1.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── Metrics → restricted (internal scrapers only) ──────────────
    location /metrics {
        allow 10.0.0.0/8;       # cluster / VPC ranges — adjust to your network
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        proxy_pass       http://vidhisangh_backend;
        proxy_set_header Host $host;
    }

    # ─── Everything else → frontend SPA ─────────────────────────────
    location / {
        proxy_pass         http://vidhisangh_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}

# ─── HTTPS :443 — API host (api.vidhisangh.com) ─────────────────────
# Optional dedicated vhost so the API can be reached at its own subdomain.
server {
    listen      80;
    listen      [::]:80;
    server_name api.vidhisangh.com;

    # ─── TLS 1.3 (uncomment when certs exist) ───────────────────────
    # listen              443 ssl;
    # listen              [::]:443 ssl;
    # http2               on;
    # ssl_certificate     /etc/nginx/certs/api.vidhisangh.com/fullchain.pem; # placeholder
    # ssl_certificate_key /etc/nginx/certs/api.vidhisangh.com/privkey.pem;   # placeholder
    # ssl_protocols       TLSv1.3 TLSv1.2;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    server_tokens off;
    client_max_body_size 50m;

    location / {
        proxy_pass         http://vidhisangh_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
