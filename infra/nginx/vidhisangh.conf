# ════════════════════════════════════════════════════════════════════
#  VidhiSangh — production edge (nginx), vidhisangh.com
#
#  This file is the committed template for what runs on the host
#  (A-15 — no more hand-configured drift). Deploy as
#    /etc/nginx/sites-available/vidhisangh.conf  →  sites-enabled/
#    /etc/nginx/snippets/vidhisangh-headers.conf  (infra/nginx/snippets/)
#  then `sudo nginx -t && sudo systemctl reload nginx`.
#
#  Layout on the host (docs/DEPLOYMENT.md):
#    SPA      : /opt/vidhisangh/frontend/dist/vidhisangh/browser  (static)
#    API      : gunicorn/uvicorn on 127.0.0.1:8000  (systemd vidhisangh-api)
#    TLS      : Let's Encrypt via certbot dns-01 (ECDSA)
#
#  Security decisions, each tied to an audit finding:
#    - TLS only on :443, TLS 1.2 + 1.3, Mozilla "intermediate" ciphers,
#      OCSP stapling, server_tokens off                      (I-10)
#    - :80 serves ONLY the ACME challenge and 301s to https  (A-15)
#    - every location that sets a header `include`s the headers snippet
#      so HSTS / CSP / XFO are never lost to add_header inheritance (I-2, I-3)
#    - KYC and portal tokens are masked in the access log    (I-7)
#    - X-Forwarded-For is set to $remote_addr — never appended — so a
#      client cannot smuggle a spoofed address past the rate limiter (A-2)
#    - /metrics is denied at the edge                        (A-27)
#    - client_max_body_size matches VS_MAX_UPLOAD_BYTES (25 MiB) (A-22)
# ════════════════════════════════════════════════════════════════════

# ─── Upstream ───────────────────────────────────────────────────────
upstream vidhisangh_api {
    server 127.0.0.1:8000;
    keepalive 64;
}

# WebSocket upgrade helper.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Access-log token masking (I-7) ─────────────────────────────────
# Client-facing KYC forms and portal links carry a bearer token as a path
# segment. Replace the token with a fixed marker before the line is logged
# so a leaked or rotated log never contains a usable credential.
map $request_uri $masked_uri {
    default                                            $request_uri;
    "~^(?<p>/api/v1/kyc/)[^/?]+(?<rest>.*)$"           "${p}<token>${rest}";
    "~^(?<p>/api/v1/portal/client/)[^/?]+(?<rest>.*)$" "${p}<token>${rest}";
    "~^(?<p>/kyc/)[^/?]+(?<rest>.*)$"                  "${p}<token>${rest}";
    "~^(?<p>/portal/)[^/?]+(?<rest>.*)$"               "${p}<token>${rest}";
}

log_format vidhisangh_masked
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $masked_uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

# ─── Rate limiting at the edge (defence in depth; the app limits too) ─
limit_req_zone $binary_remote_addr zone=vs_auth:10m  rate=20r/m;
limit_req_zone $binary_remote_addr zone=vs_api:10m   rate=600r/m;
limit_req_status 429;

# ─── HTTP :80 — ACME challenge + redirect only ──────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name vidhisangh.com www.vidhisangh.com;

    server_tokens off;
    access_log /var/log/nginx/vidhisangh.access.log vidhisangh_masked;

    # Kept for the http-01 fallback; production renews via dns-01.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS :443 — www → apex ────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.vidhisangh.com;

    ssl_certificate     /etc/letsencrypt/live/vidhisangh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidhisangh.com/privkey.pem;
    include             snippets/vidhisangh-tls.conf;
    include             snippets/vidhisangh-headers.conf;
    server_tokens off;

    return 301 https://vidhisangh.com$request_uri;
}

# ─── HTTPS :443 — main site ─────────────────────────────────────────
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name vidhisangh.com;

    root  /opt/vidhisangh/frontend/dist/vidhisangh/browser;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/vidhisangh.access.log vidhisangh_masked;
    error_log  /var/log/nginx/vidhisangh.error.log warn;

    # ─── TLS (I-10) ─────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/vidhisangh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidhisangh.com/privkey.pem;
    include             snippets/vidhisangh-tls.conf;

    # ─── Headers — repeated in every location below (I-2) ───────────
    include snippets/vidhisangh-headers.conf;

    # ─── Compression ────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/manifest+json image/svg+xml
                    application/wasm font/woff2;

    # Upload cap — must equal VS_MAX_UPLOAD_BYTES (25 MiB) so nginx and the
    # app agree; nginx answers 413 first and the app never sees the body.
    client_max_body_size 25m;
    client_body_timeout  60s;

    # ─── Metrics: never from the edge (A-27) ────────────────────────
    location = /metrics {
        include snippets/vidhisangh-headers.conf;
        return 404;
    }
    location = /api/v1/metrics {
        include snippets/vidhisangh-headers.conf;
        return 404;
    }

    # ─── Credential endpoints — tighter edge limit (A-2) ────────────
    location ~ ^/api/v1/auth/(login|register|refresh|password|mfa|oauth|passkeys) {
        limit_req zone=vs_auth burst=10 nodelay;
        include snippets/vidhisangh-headers.conf;
        include snippets/vidhisangh-proxy.conf;
    }

    # ─── Realtime WebSocket ─────────────────────────────────────────
    location /api/v1/ws {
        include snippets/vidhisangh-headers.conf;
        proxy_pass         http://vidhisangh_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── API → gunicorn ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=vs_api burst=100 nodelay;
        include snippets/vidhisangh-headers.conf;
        include snippets/vidhisangh-proxy.conf;
    }

    # ─── Hashed bundles: immutable cache (headers repeated!) ────────
    location ~* \.(?:js|css|woff2|svg|png|jpg|jpeg|webp|ico|json)$ {
        include snippets/vidhisangh-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ─── Service worker + manifest: always revalidate ───────────────
    location ~* ^/(ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
        include snippets/vidhisangh-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ─── SPA shell ──────────────────────────────────────────────────
    location / {
        include snippets/vidhisangh-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps.
    location ~ /\. { deny all; return 404; }
    location ~* \.map$ { deny all; return 404; }
}
