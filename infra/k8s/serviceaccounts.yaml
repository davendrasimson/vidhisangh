# One ServiceAccount per component (audit A-28). None of the workloads call
# the Kubernetes API, so the token is never mounted — a compromised pod gets
# no cluster credential. `automountServiceAccountToken: false` is set here
# AND on each pod spec (belt and braces: either alone is enough).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vidhisangh-backend
  namespace: vidhisangh
  labels:
    app.kubernetes.io/name: vidhisangh
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: vidhisangh
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vidhisangh-worker
  namespace: vidhisangh
  labels:
    app.kubernetes.io/name: vidhisangh
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: vidhisangh
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vidhisangh-frontend
  namespace: vidhisangh
  labels:
    app.kubernetes.io/name: vidhisangh
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: vidhisangh
automountServiceAccountToken: false
