apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidhisangh-frontend
  namespace: vidhisangh
  labels:
    app.kubernetes.io/name: vidhisangh
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: vidhisangh
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vidhisangh
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vidhisangh
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: vidhisangh
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # nginx user in nginx:1.27-alpine
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/vidhisangh/frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # nginx needs to write its cache + pid; provide writable scratch dirs.
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vidhisangh-frontend
  namespace: vidhisangh
  labels:
    app.kubernetes.io/name: vidhisangh
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: vidhisangh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vidhisangh
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
