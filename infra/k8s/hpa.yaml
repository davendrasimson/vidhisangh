apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vidhisangh-backend
  namespace: vidhisangh
  labels:
    app.kubernetes.io/name: vidhisangh
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: vidhisangh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vidhisangh-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
