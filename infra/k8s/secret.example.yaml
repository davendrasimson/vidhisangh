# ════════════════════════════════════════════════════════════════════
#  EXAMPLE ONLY — DO NOT COMMIT REAL SECRET VALUES.
#
#  In production these values MUST come from a secrets manager, e.g.
#  Sealed Secrets, External Secrets Operator (backed by Vault / AWS
#  Secrets Manager / Azure Key Vault / GCP Secret Manager), or SOPS.
#  This file only documents the required keys and their shape so the
#  Deployments (which `envFrom` this Secret) have a valid contract.
#
#  Create the real Secret out-of-band, for example:
#    kubectl -n vidhisangh create secret generic vidhisangh-secrets \
#      --from-literal=VS_SECRET_KEY=... \
#      --from-literal=VS_POSTGRES_PASSWORD=... \
#      --from-literal=VS_ANTHROPIC_API_KEY=...
# ════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: vidhisangh-secrets
  namespace: vidhisangh
  labels:
    app.kubernetes.io/name: vidhisangh
    app.kubernetes.io/part-of: vidhisangh
type: Opaque
stringData:
  # ─── Core security ────────────────────────────────────────────────
  VS_SECRET_KEY: "REPLACE_ME__64_byte_random_secret"          # placeholder

  # ─── Database ─────────────────────────────────────────────────────
  VS_POSTGRES_PASSWORD: "REPLACE_ME__postgres_password"       # placeholder

  # ─── Object storage credentials ───────────────────────────────────
  VS_S3_ACCESS_KEY: "REPLACE_ME__s3_access_key"               # placeholder
  VS_S3_SECRET_KEY: "REPLACE_ME__s3_secret_key"               # placeholder

  # ─── AI / LLM provider keys ───────────────────────────────────────
  VS_ANTHROPIC_API_KEY: "REPLACE_ME__anthropic_api_key"       # placeholder
  VS_OPENAI_API_KEY: "REPLACE_ME__openai_api_key"             # placeholder

  # ─── OAuth / social login client secrets ──────────────────────────
  VS_OAUTH_GOOGLE_CLIENT_SECRET: "REPLACE_ME"                 # placeholder
  VS_OAUTH_MICROSOFT_CLIENT_SECRET: "REPLACE_ME"             # placeholder
  VS_OAUTH_LINKEDIN_CLIENT_SECRET: "REPLACE_ME"             # placeholder

  # ─── Notifications ────────────────────────────────────────────────
  VS_SMTP_PASSWORD: "REPLACE_ME__smtp_password"              # placeholder
