apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidhisangh-worker
  namespace: vidhisangh
  labels:
    app.kubernetes.io/name: vidhisangh
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: vidhisangh
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vidhisangh
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vidhisangh
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: vidhisangh
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/vidhisangh/backend:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: vidhisangh-config
            - secretRef:
                name: vidhisangh-secrets
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A app.worker.celery_app inspect ping -d celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
