# Install as /etc/systemd/system/vidhisangh-api.service.d/smtp-credential.conf.
# The encrypted credential is bound to this host and decrypted by systemd only
# into the service's private /run/credentials directory.
[Service]
LoadCredentialEncrypted=smtp_password:/etc/credstore.encrypted/vidhisangh.smtp_password
Environment=VS_SMTP_PASSWORD_FILE=%d/smtp_password
