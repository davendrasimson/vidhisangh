# ════════════════════════════════════════════════════════════════════
#  VidhiSangh — Frontend container nginx server block
#  Loaded as /etc/nginx/conf.d/default.conf (inside the http{} context).
#  Serves the Angular SPA, proxies /api/ to the backend service, and
#  applies caching + security headers. Runs unprivileged on :8080.
# ════════════════════════════════════════════════════════════════════

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not leak the nginx version.
    server_tokens off;

    # ─── Compression ────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/wasm
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # ─── Security headers (applied to every response) ───────────────
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header X-Frame-Options          "DENY"                         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    # CSP tuned for an Angular (AOT) SPA that talks to the VidhiSangh API.
    # 'unsafe-inline' on style-src is required by Angular Material's inlined styles.
    # Razorpay Checkout: loads checkout.razorpay.com, frames + XHRs api.razorpay.com.
    add_header Content-Security-Policy  "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https://*.razorpay.com; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; manifest-src 'self'; worker-src 'self' blob:; connect-src 'self' https://api.vidhisangh.com wss://api.vidhisangh.com https://api.razorpay.com https://lumberjack.razorpay.com; form-action 'self'" always;

    # ─── API reverse proxy ──────────────────────────────────────────
    # Same-origin /api/ avoids CORS in the browser; upstream is the
    # backend service on the container network.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket / SSE upgrade for realtime endpoints under /api/v1.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # ─── Hashed static assets → cache aggressively (immutable) ──────
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ─── Service worker & manifest → never cache stale ──────────────
    location = /ngsw-worker.js        { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /ngsw.json             { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-cache" always; try_files $uri =404; }

    # ─── index.html → never cache (so new deploys are picked up) ────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ─── SPA fallback ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Maps an incoming Upgrade header to the correct Connection value for
# WebSocket proxying (empty → "" so keep-alive is preserved otherwise).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
