<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in to VidhiSangh</title>
<link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
<style>
  :root { --bg: #f6f7fb; --card: #fff; --text: #1a1d29; --muted: #5d6477; --brand: #1f4e8c; --line: #e3e6ee; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11141c; --card: #1a1e2a; --text: #eef0f6; --muted: #a2a8ba; --brand: #7fb0f0; --line: #2a3040; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; max-width: 420px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0 0 18px; color: var(--muted); }
  a.btn { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
  a.link { color: var(--brand); }
</style>
</head>
<body>
<main>
  <h1>This page is part of the VidhiSangh app</h1>
  <p>Sign in to open it. New here? Membership is free for India's legal fraternity.</p>
  <p><a class="btn" id="open" href="/auth/login" rel="nofollow">Sign in and open</a></p>
  <p><a class="link" href="/auth/register" rel="nofollow">Join VidhiSangh free</a> · <a class="link" href="/">Home</a></p>
</main>
<script>
  // nginx serves this page for /app/* to browsers without the vs_member cookie (crawlers, mostly).
  // A member's browser carries the session marker the app sets at sign-in: restore the cookie and load the app.
  (function () {
    var here = location.pathname + location.search;
    try {
      if (localStorage.getItem('vs.session') === '1') {
        document.cookie = 'vs_member=1; Path=/; Max-Age=31536000; SameSite=Lax; Secure';
        location.replace(here);
        return;
      }
    } catch (e) { /* storage unavailable: the sign-in button still works */ }
    var open = document.getElementById('open');
    open.href = '/auth/login?returnUrl=' + encodeURIComponent(here);
  })();
</script>
</body>
</html>
